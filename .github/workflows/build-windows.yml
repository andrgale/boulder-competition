name: Build Windows EXE + MSI

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      # ✅ CHECKOUT
      - uses: actions/checkout@v4

      # ✅ LEGGI NOME + VERSIONE
      - name: Get app info
        id: appinfo
        run: |
          $name = Select-String -Path pubspec.yaml -Pattern '^name:' | % { $_.Line.Split(' ')[1] }
          $versionRaw = Select-String -Path pubspec.yaml -Pattern '^version:' | % { $_.Line.Split(' ')[1] }

          # 🔥 rimuove il +build
          $version = $versionRaw.Split('+')[0]

          echo "app_name=$name" >> $env:GITHUB_OUTPUT
          echo "version=$version" >> $env:GITHUB_OUTPUT

      # ✅ SETUP FLUTTER
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - run: flutter config --enable-windows-desktop
      - run: flutter pub get

      # ✅ BUILD ADMIN PROD
      - run: flutter build windows -t lib/main_admin_prod.dart

      # ✅ TROVA EXE
      - name: Find EXE
        id: findexe
        run: |
          $exe = Get-ChildItem build/windows/x64/runner/Release -Filter *.exe | Select-Object -First 1
          echo "exe_name=$($exe.Name)" >> $env:GITHUB_OUTPUT

      # ✅ CREA ZIP
      - name: Zip EXE
        id: zipstep
        run: |
          $app = "${{ steps.appinfo.outputs.app_name }}"
          $ver = "${{ steps.appinfo.outputs.version }}"
          $zip = "$app-$ver-windows.zip"

          Compress-Archive -Path build/windows/x64/runner/Release/* -DestinationPath $zip
          echo "zip_name=$zip" >> $env:GITHUB_OUTPUT

      # ✅ INSTALLA WiX
      - run: choco install wixtoolset -y

      # ✅ GENERA LISTA FILE
      - name: Heat directory
        run: |
          heat dir build/windows/x64/runner/Release `
          -cg AppFiles `
          -dr INSTALLFOLDER `
          -srd `
          -gg `
          -out files.wxs

        # ✅ CREA INSTALLER
      - name: Create main.wxs
        run: |
          $app = "${{ steps.appinfo.outputs.app_name }}"
          $ver = "${{ steps.appinfo.outputs.version }}"
          $exe = "${{ steps.findexe.outputs.exe_name }}"

            @"
          <?xml version="1.0" encoding="UTF-8"?>
          <Wix xmlns="http://schemas.microsoft.com/wix/2006/wi">

            <Product Id="*"
                    Name="$app"
                    Manufacturer="MyCompany"
                    Version="$ver"
                    UpgradeCode="12345678-1234-1234-1234-123456789012"
                    Language="1033">

              <Package InstallerVersion="500"
                      Compressed="yes"
                      InstallScope="perMachine" />

              <MediaTemplate />

              <Directory Id="TARGETDIR" Name="SourceDir">
                <Directory Id="ProgramFilesFolder">
                  <Directory Id="INSTALLFOLDER" Name="$app"/>
                </Directory>
                <Directory Id="DesktopFolder" />
              </Directory>

              <Feature Id="MainFeature" Level="1">
                <ComponentGroupRef Id="AppFiles"/>
                <ComponentRef Id="ShortcutComponent"/>
              </Feature>

              <DirectoryRef Id="INSTALLFOLDER">
                <Component Id="ShortcutComponent" Guid="*">
                  <Shortcut Id="DesktopShortcut"
                            Directory="DesktopFolder"
                            Name="$app"
                            Target="[INSTALLFOLDER]$exe"/>
                  <RegistryValue Root="HKCU"
                                Key="Software\\$app"
                                Name="installed"
                                Type="integer"
                                Value="1"
                                KeyPath="yes"/>
                </Component>
              </DirectoryRef>

            </Product>

          </Wix>
          "@ > main.wxs

      # ✅ BUILD MSI
      - name: Build MSI
        id: msistep
        run: |
          $app = "${{ steps.appinfo.outputs.app_name }}"
          $ver = "${{ steps.appinfo.outputs.version }}"
          $msi = "$app-$ver.msi"

          candle main.wxs files.wxs
          light main.wixobj files.wixobj -o $msi

          echo "msi_name=$msi" >> $env:GITHUB_OUTPUT

      # ✅ UPLOAD ARTIFACT
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-build
          path: |
            ${{ steps.zipstep.outputs.zip_name }}
            ${{ steps.msistep.outputs.msi_name }}

      # ✅ RELEASE AUTOMATICA
      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.appinfo.outputs.version }}
          name: Release v${{ steps.appinfo.outputs.version }}
          files: |
            ${{ steps.zipstep.outputs.zip_name }}
            ${{ steps.msistep.outputs.msi_name }}