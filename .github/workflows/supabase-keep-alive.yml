name: Supabase Keep Alive

on:
  schedule:
    # Ogni 3 giorni alle 07:17 UTC
    - cron: '17 7 */2 * *'

    # Permette di lanciarlo manualmente per fare un test
  workflow_dispatch:

jobs:
  keep-alive:
    runs-on: ubuntu-latest

    steps:
      - name: Ping Supabase
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}

        run: |
          curl --fail --show-error \
            "${SUPABASE_URL}/rest/v1/keep_alive?select=id&limit=1" \
            -H "apikey: ${SUPABASE_KEY}"