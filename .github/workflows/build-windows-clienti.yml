name: Build Clienti Windows EXE + MSI

on:
  workflow_dispatch:

permissions:
    contents: write

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      # ✅ CHECKOUT
      - uses: actions/checkout@v4

      # ✅ LEGGI NOME + VERSIONE
      - name: Get app info
        id: appinfo
        run: |
          $name = (Select-String -Path pubspec.yaml -Pattern '^name:' | % { $_.Line.Split(' ')[1] }) + "_clienti"
          $versionRaw = Select-String -Path pubspec.yaml -Pattern '^version:' | % { $_.Line.Split(' ')[1] }

          # 🔥 rimuove il +build
          $version = $versionRaw.Split('+')[0]

          echo "app_name=$name" >> $env:GITHUB_OUTPUT
          echo "version=$version" >> $env:GITHUB_OUTPUT

      # ✅ SETUP FLUTTER
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - run: flutter config --enable-windows-desktop
      - run: flutter pub get

      # ✅ BUILD ADMIN PROD
      - run: flutter build windows -t lib/main_client.dart

      # ✅ TROVA EXE
      - name: Find EXE
        id: findexe
        run: |
          $exe = Get-ChildItem build/windows/x64/runner/Release -Filter *.exe | Select-Object -First 1
          echo "exe_name=$($exe.Name)" >> $env:GITHUB_OUTPUT

      # ✅ CREA ZIP
      - name: Zip EXE
        id: zipstep
        run: |
          $app = "${{ steps.appinfo.outputs.app_name }}"
          $ver = "${{ steps.appinfo.outputs.version }}"
          $zip = "$app-$ver-windows.zip"

          Compress-Archive -Path build/windows/x64/runner/Release/* -DestinationPath $zip
          echo "zip_name=$zip" >> $env:GITHUB_OUTPUT

      # ✅ INSTALLA WiX
      - run: choco install wixtoolset -y

      # ✅ GENERA LISTA FILE
      - name: Heat directory
        run: |
          heat dir build/windows/x64/runner/Release `
          -cg AppFiles `
          -dr INSTALLFOLDER `
          -srd `
          -gg `
          -out files.wxs

      # ✅ FILE LICENZA MINIMO RICHIESTO DA WixUI_Minimal
      - name: Create dummy license
        run: |
          $app = "${{ steps.appinfo.outputs.app_name }}"
          @"
          {\rtf1\ansi
          Licenza d'uso $app. Procedendo con l'installazione accetti i termini d'uso.
          }
          "@ > License.rtf

        # ✅ CREA INSTALLER
      - name: Create main.wxs
        run: |
          $app = "${{ steps.appinfo.outputs.app_name }}"
          $ver = "${{ steps.appinfo.outputs.version }}"
          $exe = "${{ steps.findexe.outputs.exe_name }}"

            @"
          <?xml version="1.0" encoding="UTF-8"?>
          <Wix xmlns="http://schemas.microsoft.com/wix/2006/wi" xmlns:ui="http://schemas.microsoft.com/wix/UIExtension">

            <Product Id="*"
                    Name="$app"
                    Manufacturer="MyCompany"
                    Version="$ver"
                    UpgradeCode="B7A463D9-14E5-4FB6-AC5C-E60518BA8E25"
                    Language="1033">

              <Package InstallerVersion="500"
                      Compressed="yes"
                      InstallScope="perMachine" />

              <MediaTemplate EmbedCab="yes"/>

              <Directory Id="TARGETDIR" Name="SourceDir">
                <Directory Id="ProgramFilesFolder">
                  <Directory Id="INSTALLFOLDER" Name="$app"/>
                </Directory>
                <Directory Id="DesktopFolder" />
              </Directory>

              <!-- ✅ Componente collegamento sul Desktop -->
              <DirectoryRef Id="DesktopFolder">
                <Component Id="DesktopShortcut" Guid="*">
                  <Shortcut Id="AppDesktopShortcut"
                            Name="$app"
                            Description="Avvia $app"
                            Target="[INSTALLFOLDER]$exe"
                            WorkingDirectory="INSTALLFOLDER" />
                  <RemoveFolder Id="RemoveDesktopFolder" On="uninstall" />
                  <RegistryValue Root="HKCU"
                                 Key="Software\MyCompany\$app"
                                 Name="DesktopShortcutInstalled"
                                 Type="integer"
                                 Value="1"
                                 KeyPath="yes" />
                </Component>
              </DirectoryRef>

              <Feature Id="MainFeature" Level="1">
                <ComponentGroupRef Id="AppFiles"/>
                <ComponentRef Id="DesktopShortcut"/>
              </Feature>

              <!-- ✅ UI standard con messaggio di completamento personalizzato -->
              <UIRef Id="WixUI_Minimal" />
              <WixVariable Id="WixUILicenseRtf" Value="License.rtf" Overridable="yes" />

              <Property Id="WIXUI_EXITDIALOGOPTIONALTEXT"
                         Value="Installazione completata correttamente. $app e pronto all'uso." />

            </Product>

          </Wix>
          "@ > main.wxs

      # ✅ BUILD MSI
      - name: Build MSI
        id: msistep
        run: |
          $app = "${{ steps.appinfo.outputs.app_name }}"
          $ver = "${{ steps.appinfo.outputs.version }}"
          $msi = "$app-$ver.msi"

          candle main.wxs files.wxs -ext WixUIExtension
          light main.wixobj files.wixobj -ext WixUIExtension -b build/windows/x64/runner/Release -o $msi

          echo "msi_name=$msi" >> $env:GITHUB_OUTPUT

      # ✅ UPLOAD ARTIFACT
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-build-clienti
          path: |
            ${{ steps.zipstep.outputs.zip_name }}
            ${{ steps.msistep.outputs.msi_name }}

      # ✅ RELEASE AUTOMATICA
      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: Clienti-v${{ steps.appinfo.outputs.version }}
          name: Release Clienti v${{ steps.appinfo.outputs.version }}
          files: |
            ${{ steps.zipstep.outputs.zip_name }}
            ${{ steps.msistep.outputs.msi_name }}